spring.application.name=BugBoard26-backend
server.port=8080

# Profile attivo di default (verrà caricato application-dev.properties localmente)
spring.profiles.active=dev

# DATABASE (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/bugboard26
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# La password è in application-dev.properties

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Rimosso il dialetto esplicito per permettere l'auto-rilevamento

# Logging
logging.level.org.springframework.jdbc.datasource=INFO
logging.level.org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl=INFO
logging.level.org.hibernate.tool.schema=INFO
logging.level.org.hibernate.SQL=INFO

# JWT Configuration
jwt.expiration=86400000
# jwt.secret è in application-dev.properties